  ctx.beginPath(); ctx.moveTo(-8,-60); ctx.quadraticCurveTo(-4,-56,0,-58); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5,-59); ctx.quadraticCurveTo(8,-55,12,-57); ctx.stroke();
  // Angry eyebrows - THICK
  ctx.fillStyle='#2d1506'; ctx.lineWidth=0;
  ctx.save(); ctx.translate(-10,-50); ctx.rotate(-0.4);
  ctx.fillRect(-8,-3,16,6); ctx.restore();
  ctx.save(); ctx.translate(10,-50); ctx.rotate(0.4);
  ctx.fillRect(-8,-3,16,6); ctx.restore();

  // Scar
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(15,-55); ctx.lineTo(18,-40); ctx.stroke();

  // Delivery cap
  ctx.fillStyle='#1e3a8a';
  ctx.beginPath(); ctx.ellipse(0,-62,28,8,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-28,-72,56,12,4); ctx.fill();
  ctx.fillStyle='#FF6B35';
  ctx.beginPath(); ctx.roundRect(-10,-70,20,8,2); ctx.fill();
  ctx.fillStyle='white'; ctx.font='bold 5px sans-serif'; ctx.textAlign='center';
  ctx.fillText('XPRESS',0,-64);

  // Dead: X eyes
  if (b.dead) {
    ctx.fillStyle='#333'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center';
    ctx.fillText('X',-10,-44); ctx.fillText('X',10,-44);
    ctx.strokeStyle='#FFD700'; ctx.lineWidth=2;
    for(let s=0;s<6;s++){
      const a=s*Math.PI/3;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*20,-70); ctx.lineTo(Math.cos(a)*35,-70); ctx.stroke();
    }
  }

  ctx.restore();

  // Speech bubble drawn in screen space AFTER restore so it never flips
  if (b.tauntTimer > 0 && b.taunt) {
    const alpha = Math.min(1, b.tauntTimer/20);
    // Screen position: centre top of boss
    const bsx = b.x + b.w/2 + (b.shakeX||0);
    const bsy = b.y - 18;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 11px Comic Sans MS, cursive';
    ctx.textAlign = 'center';
    const tw = ctx.measureText(b.taunt).width;
    const bw2 = tw + 22, bh2 = 26;
    // Bubble
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.roundRect(bsx - bw2/2, bsy - bh2, bw2, bh2, 7); ctx.fill();
    ctx.strokeStyle = '#FF6B35'; ctx.lineWidth = 2.5; ctx.stroke();
    // Tail pointing down
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.moveTo(bsx - 7, bsy);
    ctx.lineTo(bsx, bsy + 11);
    ctx.lineTo(bsx + 7, bsy);
    ctx.fill();
    ctx.strokeStyle = '#FF6B35'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bsx - 7, bsy); ctx.lineTo(bsx, bsy + 11); ctx.lineTo(bsx + 7, bsy); ctx.stroke();
    // Text
    ctx.fillStyle = '#1e3a8a';
    ctx.fillText(b.taunt, bsx, bsy - bh2/2 + 5);
    ctx.restore();
  }
}

function drawMoneyAndPackages() {
  // Money bills
  for (const m of moneyBills) {
    ctx.save();
    ctx.globalAlpha = m.life;
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    ctx.fillStyle='#15803d';
    ctx.beginPath(); ctx.roundRect(-18,-9,36,18,3); ctx.fill();
    ctx.fillStyle='#22c55e';
    ctx.beginPath(); ctx.roundRect(-16,-7,32,14,2); ctx.fill();
    ctx.fillStyle='#86efac'; ctx.font='bold 8px sans-serif'; ctx.textAlign='center';
    ctx.fillText('$$$',0,3);
    ctx.restore();
  }

  // Packages
  for (const pk of packages) {
    ctx.save();
    ctx.globalAlpha = pk.life;
    ctx.translate(pk.x, pk.y);
    ctx.rotate(pk.rot);
    const sz = pk.big ? 18 : 13;
    ctx.fillStyle='#92400e';
    ctx.beginPath(); ctx.roundRect(-sz,-sz,sz*2,sz*2,3); ctx.fill();
    ctx.strokeStyle='#78350f'; ctx.lineWidth=1.5; ctx.stroke();
    // Tape strips
    ctx.strokeStyle='#fef3c7'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-sz,0); ctx.lineTo(sz,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-sz); ctx.lineTo(0,sz); ctx.stroke();
    // Label
    ctx.fillStyle='white';
    ctx.beginPath(); ctx.roundRect(-sz*0.4,-sz*0.35,sz*0.8,sz*0.7,2); ctx.fill();
    ctx.fillStyle='#333'; ctx.font=`bold ${sz*0.4}px sans-serif`; ctx.textAlign='center';
    ctx.fillText('FRAGILE',0,sz*0.15);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawDeliveryHUD() {
  if (!deliveryBoss || deliveryBoss.dead) return;
  const bw=400,bh=22,bx=(canvas.width-bw)/2,by=56;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.beginPath(); ctx.roundRect(bx-4,by-4,bw+8,bh+8,8); ctx.fill();
  ctx.fillStyle='#333'; ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,4); ctx.fill();
  const pct=Math.max(0,deliveryBoss.hp/deliveryBoss.maxHp);
  ctx.fillStyle=pct>0.5?'#FF6B35':pct>0.25?'#FFD740':'#FF1744';
  ctx.beginPath(); ctx.roundRect(bx,by,bw*pct,bh,4); ctx.fill();
  ctx.fillStyle='white'; ctx.font='bold 13px Comic Sans MS, cursive'; ctx.textAlign='center';
  ctx.fillText('📦 THE DELIVERY GUY  '+deliveryBoss.hp+'/'+deliveryBoss.maxHp, canvas.width/2, by+16);
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(8,52,170,32,8); ctx.fill();
  ctx.fillStyle='#22c55e'; ctx.font='bold 13px Comic Sans MS, cursive'; ctx.textAlign='left';
  ctx.fillText('💰 BILLS: '+moneyCount+'  [Z] to throw', 16, 72);
}

function drawBombs() {
  for (const b of bombs) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Date.now() / 200);
    // Bomb body
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#a855f7'; ctx.lineWidth=2; ctx.stroke();
    // ISO label
    ctx.fillStyle='white'; ctx.font='bold 7px sans-serif'; ctx.textAlign='center';
    ctx.fillText('ISO',0,2);
    // Fuse
    ctx.strokeStyle='#FFD700'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(6,-6); ctx.quadraticCurveTo(12,-14,8,-18); ctx.stroke();
    // Spark
    ctx.fillStyle='#FF8800';
    ctx.beginPath(); ctx.arc(8,-18,3,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Boss roti projectiles
  for (const bp of bossProjectiles) {
    ctx.save();
    ctx.globalAlpha = bp.life;
    ctx.translate(bp.x, bp.y);
    ctx.rotate(bp.rot || 0);
    const isPhase2 = boss && boss.phase === 2;
    // Roti bread base - flat round flatbread
    ctx.fillStyle = isPhase2 ? '#c0392b' : '#D2691E';
    ctx.beginPath(); ctx.ellipse(0, 0, 13, 11, 0, 0, Math.PI*2); ctx.fill();
    // Slightly lighter centre
    ctx.fillStyle = isPhase2 ? '#e74c3c' : '#DEB887';
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 7, 0, 0, Math.PI*2); ctx.fill();
    // Char spots
    ctx.fillStyle = isPhase2 ? '#7b241c' : '#8B4513';
    for (let s=0;s<5;s++) {
      const sx = Math.cos(s*1.26)*5, sy = Math.sin(s*1.26)*4;
      ctx.beginPath(); ctx.ellipse(sx,sy,2,1.5,s,0,Math.PI*2); ctx.fill();
    }
    // Edge crust line
    ctx.strokeStyle = isPhase2 ? '#922b21' : '#A0522D';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(0,0,13,11,0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

function drawSurvivalHUD() {
  const lv = LEVELS[currentLevel];
  if (!lv || !lv.isBathroomLevel) return;
  const remaining = Math.max(0, Math.ceil((lv.survivalTime - survivalTimer) / 60));
  const fraction = survivalTimer / lv.survivalTime;

  // Timer bar at top centre
  const bw = 300, bh = 26, bx = (canvas.width - bw)/2, by = 56;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(bx-4,by-4,bw+8,bh+8,8); ctx.fill();
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,4); ctx.fill();
  // Fill colour shifts green -> yellow -> red as time runs out
  const pct = 1 - fraction;
  const timerColor = pct > 0.5 ? '#00E676' : pct > 0.25 ? '#FFD740' : '#FF1744';
  ctx.fillStyle=timerColor;
  ctx.beginPath(); ctx.roundRect(bx,by,bw*pct,bh,4); ctx.fill();

  // Pulsing text when < 10 seconds
  if (remaining <= 10) {
    const pulse = 0.7 + Math.sin(Date.now()/100)*0.3;
    ctx.globalAlpha = pulse;
  }
  ctx.fillStyle='white'; ctx.font='bold 14px Comic Sans MS, cursive'; ctx.textAlign='center';
  ctx.fillText('🚽 HIDE! ' + remaining + 's remaining', canvas.width/2, by+18);
  ctx.globalAlpha=1;

  // Colleague proximity warning
  for (const e of enemies) {
    const dist = Math.hypot(e.x - player.x, e.y - player.y);
    if (dist < 120) {
      const warnAlpha = (1 - dist/120) * (0.5 + Math.sin(Date.now()/80)*0.5);
      ctx.fillStyle='rgba(255,80,0,'+warnAlpha+')';
      ctx.beginPath(); ctx.arc(e.x, e.y + (e.dy||0), dist/2, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawBossHUD() {
  if (!boss || boss.dead) return;
  // Boss HP bar
  const bw = 400, bh = 22, bx = (canvas.width - bw)/2, by = 56;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.beginPath(); ctx.roundRect(bx-4,by-4,bw+8,bh+8,8); ctx.fill();
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,4); ctx.fill();
  const pct = Math.max(0, boss.hp / boss.maxHp);
  const hpColor = pct > 0.5 ? '#44FF88' : pct > 0.25 ? '#FFD700' : '#FF4444';
  ctx.fillStyle=hpColor;
  ctx.beginPath(); ctx.roundRect(bx,by,bw*pct,bh,4); ctx.fill();
  ctx.fillStyle='white'; ctx.font='bold 13px Comic Sans MS, cursive'; ctx.textAlign='center';
  ctx.fillText('🚽 THE PORCELAIN MENACE  ' + boss.hp + '/' + boss.maxHp, canvas.width/2, by+16);

  // ISO bombs counter
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(8,52,160,32,8); ctx.fill();
  ctx.fillStyle='#a855f7'; ctx.font='bold 13px Comic Sans MS, cursive'; ctx.textAlign='left';
  ctx.fillText('ISO BOMBS: ' + isoBombs + '  [Z] to throw', 16, 72);
}

function drawHUD() {
  // Score
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(8,8,150,36,8); ctx.fill();
  ctx.fillStyle='#FFD700'; ctx.font='bold 14px Comic Sans MS, cursive'; ctx.textAlign='left';
  ctx.fillText('SCORE: ' + score, 18, 31);

  // Level
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(300,8,200,36,8); ctx.fill();
  ctx.fillStyle='white'; ctx.textAlign='center';
  ctx.fillText((LEVELS[currentLevel]||{}).name || '', 400, 31);

  // Lives
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(642,8,150,36,8); ctx.fill();
  ctx.textAlign='right';
  for (let i = 0; i < 3; i++) {
    ctx.font = i < lives ? '22px serif' : '22px serif';
    ctx.globalAlpha = i < lives ? 1 : 0.25;
    ctx.fillText('💼', 782 - i*38, 33);
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0, p.size * p.life), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const f of flashEffects) {
    ctx.globalAlpha = f.life;
    if (f.isBart) {
      // Angry red speech bubble style
      ctx.font = 'bold 13px Comic Sans MS, cursive';
      ctx.textAlign = 'center';
      const tw = ctx.measureText(f.text).width;
      const bx = f.x - tw/2 - 6, by = f.y - (1-f.life)*30 - 18;
      const bw = tw + 12, bh = 20;
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 5); ctx.fill();
      ctx.strokeStyle='#922b21'; ctx.lineWidth=1.5; ctx.stroke();
      // Bubble tail
      ctx.beginPath(); ctx.moveTo(f.x-6, by+bh); ctx.lineTo(f.x, by+bh+8); ctx.lineTo(f.x+6, by+bh); ctx.fill();
      ctx.fillStyle='white'; ctx.strokeStyle='white'; ctx.lineWidth=0;
      ctx.fillText(f.text, f.x, by+bh-5);
    } else {
      ctx.fillStyle = '#FFD700';
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 3;
      ctx.font = 'bold 18px Comic Sans MS, cursive';
      ctx.textAlign = 'center';
      ctx.strokeText(f.text, f.x, f.y - (1-f.life)*40);
      ctx.fillText(f.text, f.x, f.y - (1-f.life)*40);
    }
  }
  ctx.globalAlpha = 1;
}

function drawOverlay(title, subtitle, hint, bgColor) {
  ctx.fillStyle = bgColor || 'rgba(0,0,0,0.72)';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Card
  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.beginPath(); ctx.roundRect(200,120,400,260,20); ctx.fill();
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=5; ctx.stroke();

  ctx.textAlign='center';
  ctx.fillStyle='#1a1a2e'; ctx.font='bold 36px Comic Sans MS, cursive';
  ctx.fillText(title, 400, 188);

  ctx.fillStyle='#555'; ctx.font='18px Comic Sans MS, cursive';
  const lines = subtitle.split('\n');
  lines.forEach((l,i) => ctx.fillText(l, 400, 228 + i*28));

  // Pulsing button
  const pulse = 0.92 + Math.sin(Date.now()/300)*0.08;
  ctx.save(); ctx.translate(400, 330); ctx.scale(pulse,pulse);
  ctx.fillStyle='#FFD700';
  ctx.beginPath(); ctx.roundRect(-110,-22,220,44,12); ctx.fill();
  ctx.strokeStyle='#e6ac00'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#1a1a2e'; ctx.font='bold 16px Comic Sans MS, cursive';
  ctx.fillText(hint, 0, 7);
  ctx.restore();
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
function gameLoop() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  updateBombButton();
  if (audioStarted) updateMusic();

  if (gameState === STATE.INTRO) {
    introTimer++;
    // Dark cinematic background
    const iGrad = ctx.createLinearGradient(0,0,0,canvas.height);
    iGrad.addColorStop(0,'#0d0d1a'); iGrad.addColorStop(1,'#1a0a00');
    ctx.fillStyle=iGrad; ctx.fillRect(0,0,canvas.width,canvas.height);

    // Slow floating dust motes
    ctx.fillStyle='rgba(255,215,0,0.18)';
    for(let i=0;i<12;i++){
      const mx=100+i*58, my=((introTimer*0.3+i*55)%520)-20;
      ctx.beginPath(); ctx.arc(mx,my,1.5+i%3,0,Math.PI*2); ctx.fill();
    }

    // Devi standing centre, slightly larger
    const savedPlayer2 = {...player};
    player.x = 368; player.y = 260; player.facing = 1; player.onGround = true; player.vx=0;
    ctx.save(); ctx.translate(400,300); ctx.scale(1.4,1.4); ctx.translate(-400,-300);
    drawDevi();
    ctx.restore();
    Object.assign(player, savedPlayer2);

    // Spotlight glow behind Devi
    ctx.save();
    const spot = ctx.createRadialGradient(400,310,10,400,310,160);
    spot.addColorStop(0,'rgba(255,200,80,0.13)');
    spot.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=spot; ctx.fillRect(0,0,800,500);
    ctx.restore();

    // Typewriter-style text reveal
    const fullText1 = "You're an overpaid quality manager.";
    const fullText2 = "You didn't choose this life.";
    const fullText3 = "It chose you.";
    const charsPerFrame = 1.5;
    const t1end = fullText1.length / charsPerFrame;
    const t2end = t1end + 40 + fullText2.length / charsPerFrame;
    const t3end = t2end + 40 + fullText3.length / charsPerFrame;

    const show1 = Math.min(fullText1.length, Math.max(0, Math.floor(introTimer * charsPerFrame)));
    const show2 = Math.min(fullText2.length, Math.max(0, Math.floor((introTimer - t1end - 40) * charsPerFrame)));
    const show3 = Math.min(fullText3.length, Math.max(0, Math.floor((introTimer - t2end - 40) * charsPerFrame)));

    ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,0.9)'; ctx.shadowBlur=8;

    if (show1 > 0) {
      ctx.fillStyle='rgba(220,220,220,'+(Math.min(1,introTimer/20))+')';
      ctx.font='italic 22px Comic Sans MS, cursive';
      ctx.fillText(fullText1.slice(0, show1), 400, 128);
    }
    if (show2 > 0) {
      ctx.fillStyle='rgba(220,220,220,1)';
      ctx.font='italic 22px Comic Sans MS, cursive';
      ctx.fillText(fullText2.slice(0, show2), 400, 164);
    }
    if (show3 > 0) {
      const s3fade = Math.min(1,(introTimer - t2end - 40)/15);
      ctx.fillStyle='rgba(255,215,0,'+s3fade+')';
      ctx.font='bold italic 28px Comic Sans MS, cursive';
      ctx.fillText(fullText3.slice(0, show3), 400, 208);
    }
    ctx.shadowBlur=0;

    // Continue prompt — only after all text has shown
    if (introTimer > t3end + 30) {
      const pAlpha = 0.5 + Math.sin(Date.now()/400)*0.5;
      ctx.fillStyle='rgba(255,255,255,'+pAlpha*0.7+')';
      ctx.font='14px Comic Sans MS, cursive';
      ctx.fillText(isTouchDevice ? 'Tap to continue' : 'Press SPACE to continue', 400, 460);
    }
  }
  else if (gameState === STATE.MENU) {
    // Draw a nice menu BG
    const grad = ctx.createLinearGradient(0,0,0,canvas.height);
    grad.addColorStop(0,'#1a1a2e'); grad.addColorStop(1,'#16213e');
    ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.width,canvas.height);

    // Floating office doodles
    for(let i=0;i<6;i++){
      const bx=80+i*130, by=60+Math.sin(Date.now()/1000+i)*15;
      ctx.globalAlpha=0.15; ctx.fillStyle='#FFD700';
      ctx.font='30px serif'; ctx.textAlign='center';
      ctx.fillText(['📋','🧻','💼','⭐','📁','✅'][i], bx, by);
    }
    ctx.globalAlpha=1;

    ctx.textAlign='center';
    ctx.fillStyle='#FFD700'; ctx.font='bold 52px Comic Sans MS, cursive';
    ctx.shadowColor='#FF8C00'; ctx.shadowBlur=20;
    ctx.fillText("Devi's Quality Quest", 400, 130);
    ctx.shadowBlur=0;

    ctx.fillStyle='white'; ctx.font='18px Comic Sans MS, cursive';
    ctx.fillText('Help Devi collect reports & toilet paper', 400, 175);
    ctx.fillText('while dodging RECALLS and BART!', 400, 205);

    // Mini Devi preview
    const savedPlayer = {...player};
    player.x = 370; player.y = 230; player.facing = 1; player.onGround = true; player.vx=0;
    drawDevi();
    Object.assign(player, savedPlayer);

    ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.font='14px Comic Sans MS, cursive';
    ctx.fillText('← → Move  |  SPACE Jump', 400, 310);

    const pulse2 = 0.94 + Math.sin(Date.now()/300)*0.06;
    ctx.save(); ctx.translate(400,370); ctx.scale(pulse2,pulse2);
    ctx.fillStyle='#FFD700';
    ctx.beginPath(); ctx.roundRect(-130,-24,260,48,14); ctx.fill();
    ctx.fillStyle='#1a1a2e'; ctx.font='bold 20px Comic Sans MS, cursive';
    ctx.fillText(isTouchDevice ? '▶  TAP TO START' : '▶  PRESS SPACE TO START', 0, 8);
    ctx.restore();
  }
  else if (gameState === STATE.PLAYING || gameState === STATE.LEVEL_COMPLETE) {
    const isBathroomNow = LEVELS[currentLevel] && LEVELS[currentLevel].isBathroomLevel;
    if (isBathroomNow) {
      drawTopDown();
      drawParticles();
      if (gameState === STATE.LEVEL_COMPLETE) {
        drawOverlay('🚽 You Escaped!', 'Score: '+score+'\nGet ready for The Reckoning!',
          isTouchDevice?'TAP FOR NEXT LEVEL':'PRESS SPACE FOR NEXT LEVEL');
      }
    } else {
    drawBackground();
    platforms.forEach(drawPlatform);
    collectibles.forEach(drawCollectible);
    enemies.forEach(drawEnemy);
    if (boss && !boss.dead) drawToiletBoss(boss);
    if (deliveryBoss) drawDeliveryGuy(deliveryBoss);
    drawMoneyAndPackages();
    drawDeliveryHUD();
    // Explosion poop smears appear right after boss dies
    if (bossExploding && boss && boss.dead) {
      for (const s of poopSmears) {
        if (s.delay > 0) { s.delay = Math.max(0,s.delay-2); continue; }
        s.opacity = Math.min(0.7, s.opacity + 0.06);
        ctx.save();
        ctx.globalAlpha = s.opacity;
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rot);
        ctx.fillStyle='#4E342E';
        ctx.beginPath();
        const pts=6;
        for(let i=0;i<pts;i++){
          const a=(i/pts)*Math.PI*2;
          const w=s.r*(0.5+0.5*Math.sin(a*3+s.rot));
          i===0?ctx.moveTo(Math.cos(a)*w,Math.sin(a)*w):ctx.lineTo(Math.cos(a)*w,Math.sin(a)*w);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
    drawBombs();
    drawDevi();
    drawBossHUD();
    drawParticles();
    drawHUD();

    if (gameState === STATE.LEVEL_COMPLETE) {
      const nextLv = currentLevel + 1;
      const isLast = nextLv >= LEVELS.length;
      const wasBathroom = LEVELS[currentLevel] && LEVELS[currentLevel].isBathroomLevel;
      const titleText = isLast ? '🏆 All Done!' : wasBathroom ? '🚽 You Escaped!' : '✅ Level Complete!';
      const bodyText = `Score: ${score}\n${isLast ? 'Devi survives another day!' : 'Get ready for ' + LEVELS[nextLv].name + '!'}`;
      const btnText = isLast ? (isTouchDevice ? 'TAP FOR VICTORY' : 'PRESS SPACE FOR VICTORY') : (isTouchDevice ? 'TAP FOR NEXT LEVEL' : 'PRESS SPACE FOR NEXT LEVEL');
      drawOverlay(titleText, bodyText, btnText);
    }
  }
  } // end !bathroom
  else if (gameState === STATE.GAME_OVER) {
    drawBackground();
    platforms.forEach(drawPlatform);
    drawParticles();
    drawOverlay('💀 RESTRUCTURED!', `Bart got you...\nFinal Score: ${score}`, 'PRESS SPACE TO TRY AGAIN', 'rgba(80,0,0,0.75)');
  }
  else if (gameState === STATE.LIVING_ROOM) {
    cinematicTimer++;
    // Living room background
    const bgG = ctx.createLinearGradient(0,0,0,canvas.height);
    bgG.addColorStop(0,'#f5e6d3'); bgG.addColorStop(1,'#e8d5b0');
    ctx.fillStyle=bgG; ctx.fillRect(0,0,800,500);

    // Floor
    ctx.fillStyle='#c8a96e';
    ctx.fillRect(0,420,800,80);
    // Floor wood planks
    ctx.strokeStyle='#b8975a'; ctx.lineWidth=1;
    for(let fx=0;fx<800;fx+=80){ctx.beginPath();ctx.moveTo(fx,420);ctx.lineTo(fx,500);ctx.stroke();}

    // Wall picture
    ctx.fillStyle='#8B7355'; ctx.fillRect(560,60,120,90);

      if (sc3 > 160) {
        const danceT = (sc3 - 160);
        // Dance floor disco lights
        const discoColors = ['#FF1493','#FF6B35','#FFD700','#00BFFF','#7B2FFF'];
        for (let dl=0; dl<8; dl++) {
          const dlx = 80 + dl*90;
          ctx.globalAlpha = 0.18 + Math.sin(Date.now()/200 + dl) * 0.12;
          ctx.fillStyle = discoColors[dl % 5];
          ctx.beginPath();
          ctx.arc(dlx, 440, 50 + Math.sin(Date.now()/150 + dl) * 10, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Disco ball
        const dbPulse = 0.9 + Math.sin(Date.now()/100)*0.1;
        ctx.save(); ctx.translate(400, 40); ctx.scale(dbPulse,dbPulse);
        ctx.fillStyle='#DDD';
        ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.fill();
        // Mirror tiles
        for(let mt=0;mt<16;mt++){
          const ma=mt*(Math.PI*2/16)+Date.now()/2000;
          const mx=Math.cos(ma)*14, my=Math.sin(ma)*14;
          ctx.fillStyle=discoColors[mt%5];
          ctx.globalAlpha=0.7+Math.sin(Date.now()/100+mt)*0.3;
          ctx.beginPath(); ctx.roundRect(mx-4,my-4,8,8,1); ctx.fill();
        }
        ctx.globalAlpha=1;
        // Light rays from disco ball
        ctx.strokeStyle='rgba(255,255,200,0.25)';
        ctx.lineWidth=2;
        for(let lr=0;lr<8;lr++){
          const lra = lr*Math.PI/4 + Date.now()/1000;
          ctx.beginPath(); ctx.moveTo(Math.cos(lra)*22,Math.sin(lra)*22);
          ctx.lineTo(Math.cos(lra)*200,Math.sin(lra)*200); ctx.stroke();
        }
        ctx.restore();

        // Musical notes floating
        const noteChars=['♪','♫','🎵','🎶'];
        for(let n=0;n<4;n++){
          const nx=150+n*140, ny=350-((danceT*1.2+n*55)%300);
          const na=Math.max(0,Math.min(1,1-((danceT+n*55)%300)/300));
          ctx.globalAlpha=na*0.8;
          ctx.font='22px serif'; ctx.textAlign='center';
          ctx.fillText(noteChars[n%4], nx, ny);
        }
        ctx.globalAlpha=1;
      }
    }

    // ── SCENE 4: THE END (frames 1050+) ───────────────────────────────────
    if (t >= 1050) {
      // Fade to black
      const fadeBlack = Math.min(1,(t-1050)/60);
      ctx.fillStyle=`rgba(0,0,0,${fadeBlack})`;
      ctx.fillRect(0,0,800,500);
      if (t > 1090) {
        const te = t-1090;
        const ta = Math.min(1,te/40);
        ctx.globalAlpha=ta;
        ctx.fillStyle='#FFD700'; ctx.font='bold 60px Comic Sans MS, cursive';
        ctx.shadowColor='#FF8C00'; ctx.shadowBlur=24;
        ctx.textAlign='center'; ctx.fillText('THE END  💤', 400, 240);
        ctx.shadowBlur=0;
        ctx.fillStyle='white'; ctx.font='italic 22px Comic Sans MS, cursive';
        ctx.fillText('Final Score: '+score, 400, 300);
        ctx.globalAlpha=1;
      }
    }

    // Final play-again prompt
    if (t > 1150) {
      const fa=Math.min(1,(t-1150)/30);
      ctx.globalAlpha=fa;
      ctx.fillStyle='white'; ctx.font='20px Comic Sans MS, cursive'; ctx.textAlign='center';
      ctx.fillText('Final Score: ' + score, 400, 300);
      const pA2=0.5+Math.sin(Date.now()/400)*0.5;
      ctx.globalAlpha=fa*pA2;
      ctx.fillStyle='#FFD700';
      ctx.font='bold 15px Comic Sans MS, cursive';
      ctx.fillText(isTouchDevice?'Tap to play again':'Press SPACE to play again', 400, 340);
      ctx.globalAlpha=1;
    }
  }

  const _isBath = LEVELS[currentLevel] && LEVELS[currentLevel].isBathroomLevel;
  if (_isBath) {
    updateTopDown();
    updateParticles();
  } else {
    updatePlayer();
    updateEnemies();
    updateBoss();
    updateDeliveryBoss();
    updateBombs();
    updateParticles();
  }

  requestAnimationFrame(gameLoop);
}

// ── MOBILE SETUP ────────────────────────────────────────────────────────────

// Scale canvas to fit screen — leave room for virtual controls on mobile
function resizeCanvas() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  // On touch devices reserve 170px for controls at bottom
  const reservedH = isTouchDevice ? 170 : 0;
  const availH = vh - reservedH - 8;
  const availW = vw - 8;
  // Scale to fit both width and height while keeping 800x500 aspect
  const scaleW = availW / 800;
  const scaleH = availH / 500;
  const scale = Math.min(1, scaleW, scaleH);
  canvas.style.width  = Math.floor(800 * scale) + 'px';
  canvas.style.height = Math.floor(500 * scale) + 'px';
  // Centre wrapper
  const wrapper = document.getElementById('gameWrapper');
  if (wrapper) {
    wrapper.style.marginTop = isTouchDevice ? '4px' : '';
  }
}
// Must run after isTouchDevice is defined — we call it later
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

// Detect touch device
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

// Now that isTouchDevice is defined, do initial resize
resizeCanvas();

// Show controls on touch
if (isTouchDevice) {
  document.getElementById('virtualControls').style.display = 'block';
  document.getElementById('instructions').style.display = 'none';
}

// Helper: advance game state on tap/click (non-button taps)
function handleTapAdvance() {
  if (gameState === STATE.INTRO) { gameState = STATE.MENU; introTimer = 0; }
  else if (gameState === STATE.MENU) startLevel(0);
  else if (gameState === STATE.LEVEL_COMPLETE) {
    const wasDelivery2 = LEVELS[currentLevel] && LEVELS[currentLevel].isDeliveryBoss;
    const wasBathroom2 = LEVELS[currentLevel] && LEVELS[currentLevel].isBathroomLevel;
    currentLevel++;
    if (wasBathroom2) { cinematicTimer = 0; gameState = STATE.LIVING_ROOM; }
    else if (wasDelivery2 || currentLevel >= LEVELS.length) { cinematicTimer = 0; gameState = STATE.LIVING_ROOM; }
    else startLevel(currentLevel);
  }
  else if (gameState === STATE.GAME_OVER) { score = 0; lives = 3; currentLevel = 0; startLevel(0); }
  else if (gameState === STATE.WIN) { score = 0; lives = 3; currentLevel = 0; gameState = STATE.MENU; }
  else if (gameState === STATE.LIVING_ROOM) { if (cinematicTimer > 180) { cinematicTimer = 0; gameState = STATE.DELIVERY_CUTSCENE; } }
  else if (gameState === STATE.DELIVERY_CUTSCENE) { if (cinematicTimer > 200) { startDeliveryBoss(); } }
  else if (gameState === STATE.ENDING) { if (endingTimer > 1150) { score = 0; lives = 3; currentLevel = 0; gameState = STATE.MENU; } }
}

// Canvas-wide tap — advance states. Bathroom level swipe is handled separately.
canvas.addEventListener('touchend', (e) => {
  if (e.target && e.target.classList && e.target.classList.contains('vbtn')) return;
  // Don't advance state if playing or in bathroom (those need proper button/swipe)
  if (gameState === STATE.PLAYING &&
      !(LEVELS[currentLevel] && LEVELS[currentLevel].isBathroomLevel)) return;
  e.preventDefault();
  handleTapAdvance();
}, {passive: false});

// Also allow mouse click on desktop for state advancing
canvas.addEventListener('click', (e) => {
  if (gameState !== STATE.PLAYING) handleTapAdvance();
});

// Show bomb button only on level 3 (boss level)

  const btn = document.getElementById('btnBomb');

  const isBoss = lv && (lv.isBossLevel || lv.isDeliveryBoss);

      bu.style.cssText='width:60px;height:60px;left:57px;bottom:155px;';

      setupVBtn('btnUp','ArrowUp');
      const bd=document.createElement('div');bd.className='vbtn';bd.id='btnDown';bd.textContent='▼';
      bd.style.cssText='width:60px;height:60px;left:57px;bottom:15px;';

    if (document.getElementById('btnUp'))   document.getElementById('btnUp').style.display='none';
    if (document.getElementById('btnDown')) document.getElementById('btnDown').style.display='none';
  }
}

// Virtual button touch handling – mirrors keyboard keys
function setupVBtn(id, keyCode) {
  const btn = document.getElementById(id);
  if (!btn) return;
  function press(e)   { e.preventDefault(); keys[keyCode] = true;  btn.classList.add('pressed'); }
  function release(e) { e.preventDefault(); keys[keyCode] = false; btn.classList.remove('pressed'); }
  btn.addEventListener('touchstart',  press,   {passive:false});
  btn.addEventListener('touchend',    release, {passive:false});
  btn.addEventListener('touchcancel', release, {passive:false});
  // Also mouse for desktop testing
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup',   release);
  btn.addEventListener('mouseleave',release);
}

setupVBtn('btnLeft',  'ArrowLeft');
setupVBtn('btnRight', 'ArrowRight');
setupVBtn('btnJump',  'Space');
setupVBtn('btnBomb',  'KeyZ');

// Swipe support for top-down bathroom level
let _swipeX=0, _swipeY=0, _swipeActive=false;
canvas.addEventListener('touchstart', e=>{
  _swipeX=e.touches[0].clientX; _swipeY=e.touches[0].clientY;

},{passive:false});

  if(Math.abs(dx)>Math.abs(dy)){
    tdPlayer.ndx=dx>0?1:-1; tdPlayer.ndy=0;
  } else {
    tdPlayer.ndx=0; tdPlayer.ndy=dy>0?1:-1;
  }
},{passive:true});

// ─── AUDIO ENGINE ────────────────────────────────────────────────────────────
let audioCtx = null;
let currentTrack = null;
let trackNodes = [];
let audioStarted = false;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function stopMusic() {
  trackNodes.forEach(n => { try { n.stop(); } catch(e){} });
  trackNodes = [];
  if (currentTrack) clearInterval(currentTrack);
  currentTrack = null;
}

function playNote(freq, start, dur, vol=0.15, type='square') {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, audioCtx.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + start + 0.01);
  g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + start + dur - 0.01);
  o.start(audioCtx.currentTime + start);
  o.stop(audioCtx.currentTime + start + dur);
  trackNodes.push(o);
}

function playDrum(type, start, vol=0.3) {
  if (!audioCtx) return;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.15, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  if (type === 'kick') {
    for (let i=0;i<data.length;i++) {
      const t2 = i/audioCtx.sampleRate;
      data[i] = Math.sin(2*Math.PI*80*Math.exp(-t2*15)*t2*10) * Math.exp(-t2*8) * vol * 2;
    }
  } else if (type === 'snare') {
    for (let i=0;i<data.length;i++) {
      const t2 = i/audioCtx.sampleRate;
      data[i] = (Math.random()*2-1) * Math.exp(-t2*20) * vol;
    }
  } else if (type === 'hihat') {
    for (let i=0;i<data.length;i++) {
      const t2 = i/audioCtx.sampleRate;
      data[i] = (Math.random()*2-1) * Math.exp(-t2*60) * vol * 0.4;
    }
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start(audioCtx.currentTime + start);
  trackNodes.push(src);
}

// ── TRACKS ────────────────────────────────────────────────────────────────────
function playOfficeLoop() {
  if (!audioCtx || !audioStarted) return;
  stopMusic();
  // Funky office beat — 90s hip hop flavour
  const bpm = 92, beat = 60/bpm;
  function scheduleBar() {
    const now = 0;
    // Kick on 1 & 3
    playDrum('kick',  now + 0);
    playDrum('kick',  now + beat*2);
    // Snare on 2 & 4
    playDrum('snare', now + beat);
    playDrum('snare', now + beat*3);
    // Hi-hats every 8th note
    for(let h=0;h<8;h++) playDrum('hihat', now + beat*h*0.5, 0.15);
    // Funky bass line — classic 90s hip hop bassline
    const bassNotes = [65,65,0,73,0,65,70,0]; // F2,F2,_,C#3,_,F2,Bb2,_
    bassNotes.forEach((freq,i) => {
      if(freq) playNote(freq, now+beat*i*0.5, beat*0.45, 0.22, 'sawtooth');
    });
    // Stab chord (jazz-ish)
    [196,247,294].forEach(f => playNote(f, now+beat*2.5, beat*0.3, 0.07, 'square'));
    [196,247,294].forEach(f => playNote(f, now+beat*3.5, beat*0.2, 0.06, 'square'));
  }
  scheduleBar();
  currentTrack = setInterval(scheduleBar, beat*4*1000);
}

function playBossLoop() {
  if (!audioCtx || !audioStarted) return;
  stopMusic();
  const bpm = 100, beat = 60/bpm;
  function scheduleBar() {
    // Harder beat for toilet boss
    playDrum('kick',  0);
    playDrum('kick',  beat*0.75);
    playDrum('kick',  beat*2);
    playDrum('snare', beat);
    playDrum('snare', beat*3);
    for(let h=0;h<16;h++) playDrum('hihat', beat*h*0.25, 0.12);
    // Menacing bass
    [55,55,58,55,52,55,0,49].forEach((f,i) => {
      if(f) playNote(f, beat*i*0.5, beat*0.4, 0.25, 'sawtooth');
    });
    // Eerie high melody
    [523,0,494,0,523,0,554,523].forEach((f,i) => {
      if(f) playNote(f, beat*i*0.5, beat*0.3, 0.04, 'sine');
    });
  }
  scheduleBar();
  currentTrack = setInterval(scheduleBar, beat*4*1000);
}

function playBathroomLoop() {
  if (!audioCtx || !audioStarted) return;
  stopMusic();
  const bpm = 105, beat = 60/bpm;
  function scheduleBar() {
    // Pac-man chase energy — tense 90s bop
    playDrum('kick',  0); playDrum('kick', beat*1.5);
    playDrum('kick',  beat*2.5);
    playDrum('snare', beat); playDrum('snare', beat*3);
    for(let h=0;h<8;h++) playDrum('hihat', beat*h*0.5, 0.18);
    [110,110,0,123,0,110,98,0].forEach((f,i)=>{
      if(f) playNote(f, beat*i*0.5, beat*0.4, 0.2, 'sawtooth');
    });
    // Tense staccato hits
    [392,0,0,440,0,0,392,370].forEach((f,i)=>{
      if(f) playNote(f, beat*i*0.5, beat*0.15, 0.05, 'square');
    });
  }
  scheduleBar();
  currentTrack = setInterval(scheduleBar, beat*4*1000);
}

function playDeliveryLoop() {
  if (!audioCtx || !audioStarted) return;
  stopMusic();
  const bpm = 108, beat = 60/bpm;
  function scheduleBar() {
    // Hard hype beat for delivery boss fight
    playDrum('kick', 0); playDrum('kick', beat*0.5);
    playDrum('kick', beat*2); playDrum('kick', beat*2.75);
    playDrum('snare', beat); playDrum('snare', beat*3);
    for(let h=0;h<16;h++) playDrum('hihat', beat*h*0.25, 0.15);
    [73,73,0,82,0,73,78,0].forEach((f,i)=>{
      if(f) playNote(f, beat*i*0.5, beat*0.4, 0.24, 'sawtooth');
    });
    // Hype horn stabs
    [[196,247],[0,0],[233,294],[0,0],[220,277],[0,0],[196,247],[175,220]].forEach(([f1,f2],i)=>{
      if(f1){ playNote(f1, beat*i*0.5, beat*0.2, 0.07, 'square'); }
      if(f2){ playNote(f2, beat*i*0.5, beat*0.2, 0.06, 'square'); }
    });
  }
  scheduleBar();
  currentTrack = setInterval(scheduleBar, beat*4*1000);
}

function playEndingLoop() {
  if (!audioCtx || !audioStarted) return;
  stopMusic();
  const bpm = 85, beat = 60/bpm;
  function scheduleBar() {
    // Smooth laid-back 90s R&B/hip-hop for the ending
    playDrum('kick', 0); playDrum('kick', beat*2.5);
    playDrum('snare', beat*1.5); playDrum('snare', beat*3.5);
    for(let h=0;h<8;h++) playDrum('hihat', beat*h*0.5, 0.1);
    // Silky bass
    [87,87,0,98,87,0,82,87].forEach((f,i)=>{
      if(f) playNote(f, beat*i*0.5, beat*0.48, 0.18, 'sine');
    });
    // Smooth chords
    [[196,247,294],[0,0,0],[220,277,330],[0,0,0]].forEach(([f1,f2,f3],i)=>{
      if(f1){
        playNote(f1, beat*i, beat*0.8, 0.04, 'sine');
        playNote(f2, beat*i, beat*0.8, 0.04, 'sine');
        playNote(f3, beat*i, beat*0.8, 0.03, 'sine');
      }
    });
  }
  scheduleBar();
  currentTrack = setInterval(scheduleBar, beat*4*1000);
}

// ── HOOK MUSIC TO GAME STATE ──────────────────────────────────────────────────
let _lastMusicState = null;
function updateMusic() {
  const lv = LEVELS[currentLevel];
  let trackKey = gameState + '_' + currentLevel;
  if (trackKey === _lastMusicState) return;
  _lastMusicState = trackKey;

  if (gameState === STATE.PLAYING) {
    if (lv && lv.isBossLevel)        playBossLoop();
    else if (lv && lv.isBathroomLevel) playBathroomLoop();
    else if (lv && lv.isDeliveryBoss) playDeliveryLoop();
    else                               playOfficeLoop();
  } else if (gameState === STATE.ENDING || gameState === STATE.LIVING_ROOM) {
    playEndingLoop();
  } else if (gameState === STATE.MENU || gameState === STATE.INTRO) {
    playOfficeLoop();
  } else {
    stopMusic();
  }
}

// Start audio on first user interaction
function startAudioOnInteraction() {
  if (audioStarted) return;
  initAudio();
  audioStarted = true;
  updateMusic();
}

function checkOrientation() {
  const hint = document.getElementById('landscapeHint');
  if (!hint) return;
  const needsLandscape = window.innerWidth < 480 && window.innerHeight > window.innerWidth;
  hint.style.display = needsLandscape ? 'flex' : 'none';
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 300));
checkOrientation();

document.addEventListener('touchstart', startAudioOnInteraction, {once:false});
canvas.addEventListener('click', startAudioOnInteraction, {once:false});
