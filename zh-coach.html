<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>ZH Coach</title>
<style>
:root{
  --bg:#0f1115;--pan:#181c24;--pan2:#212734;--line:#303748;
  --txt:#eef1f6;--dim:#98a3b6;--acc:#f0b429;
  --usa:#4d9de0;--china:#e05555;--gla:#7bbf5a;
  --good:#5cc46a;--warn:#f0b429;--bad:#f0544f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
.wrap{max-width:1000px;margin:0 auto;padding:0 12px}

/* sticky control bar */
.top{position:sticky;top:0;z-index:30;background:#12151c;border-bottom:1px solid var(--line);padding:8px 0}
.top .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:0 0 auto}
.seg button{background:var(--pan);color:var(--dim);border:0;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:42px}
.seg button.on{background:var(--acc);color:#14161b}
.ghost{background:var(--pan);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;min-height:42px}
#snd{margin-left:auto;min-width:46px}
#snd.off{opacity:.45}

/* selection chips */
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0}
.chip{display:flex;align-items:center;gap:7px;background:var(--pan2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px}
.chip svg{width:20px;height:20px;flex:0 0 auto}
.chip .x{color:var(--dim);font-weight:400;margin-left:2px}
.chip.add{border-style:dashed;color:var(--dim);font-weight:500}
.chip.lab{background:none;border:0;color:var(--dim);font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:0 2px;cursor:default;min-height:0}

/* picker */
.pick{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.pick h2{margin:0 0 10px;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--acc)}
.fac{margin-bottom:12px}
.fac:last-child{margin:0}
.fac b{display:block;font-size:11px;letter-spacing:1.4px;color:var(--dim);margin:0 0 6px 2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:var(--pan2);border:1px solid var(--line);border-radius:14px;padding:12px 4px;
  cursor:pointer;font-size:13px;font-weight:700;text-align:center;line-height:1.2;min-height:84px;color:var(--txt)}
.tile svg{width:30px;height:30px}
.tile:active{transform:scale(.96)}
.tile.on{background:var(--acc);color:#14161b;border-color:var(--acc)}
.tile.on svg{stroke:#14161b;fill:none}
.tile.off{opacity:.3}
.f-USA{border-color:#2b4a68} .f-China{border-color:#68302f} .f-GLA{border-color:#3d5c30}
svg{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* alerts */
.alert{border-radius:12px;padding:11px 14px;margin:8px 0;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.alert.bad{background:#3a1a19;border-left:5px solid var(--bad);color:#ffc9c7}
.alert.warn{background:#3a2f12;border-left:5px solid var(--warn);color:#ffe3a3}
.alert.good{background:#16301c;border-left:5px solid var(--good);color:#bff0c6}

/* phase tabs + panel */
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}
.phases button{background:var(--pan);border:1px solid var(--line);color:var(--dim);border-radius:12px 12px 0 0;
  padding:11px 6px;font-size:14px;font-weight:700;cursor:pointer;min-height:48px;line-height:1.2}
.phases button.on{background:var(--pan2);color:var(--acc);border-bottom-color:var(--pan2)}
.phases small{display:block;font-size:11px;font-weight:500;color:var(--dim)}
.phases button.on small{color:var(--acc);opacity:.8}
.panel{background:var(--pan2);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:14px}
.panel h3{margin:0 0 8px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--acc)}
ol.bo{list-style:none;margin:0 0 14px;padding:0;counter-reset:s}
ol.bo li{counter-increment:s;position:relative;padding:9px 4px 9px 38px;border-bottom:1px solid var(--line);font-size:15.5px}
ol.bo li:last-child{border:0}
ol.bo li:before{content:counter(s);position:absolute;left:2px;top:9px;width:24px;height:24px;border-radius:8px;
  background:var(--acc);color:#14161b;font-size:13px;font-weight:800;text-align:center;line-height:24px}
ul.key{margin:0;padding:0;list-style:none}
ul.key li{position:relative;padding:6px 4px 6px 20px;font-size:14.5px;color:var(--dim)}
ul.key li:before{content:"";position:absolute;left:4px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.tech{background:#12161e;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;color:var(--dim);margin-bottom:10px;line-height:1.5}
.tech b{display:block;color:var(--acc);font-size:11px;letter-spacing:1.2px;margin-bottom:2px}
h3.ad{color:#ffd27a}
ul.adapt li{color:var(--txt);font-size:14.5px;padding-left:22px}
ul.adapt li:before{background:#ffd27a;width:8px;height:8px}
.tag{display:inline-block;color:var(--dim);font-weight:500;letter-spacing:0;text-transform:none;font-size:13px}
.sect{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.note{background:#1a1f29;border-left:4px solid var(--acc);border-radius:0 8px 8px 0;padding:9px 12px;font-size:14.5px;margin:0 0 8px}
.vs{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--bad);font-weight:800;margin:14px 0 6px}
.vs span{color:var(--dim);font-weight:500;letter-spacing:0;text-transform:none;font-size:14px;display:block;margin-top:2px}
.empty{color:var(--dim);text-align:center;padding:30px 10px;font-size:15px}
@media(max-width:520px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .tile{min-height:92px;font-size:14px}
  .tile svg{width:32px;height:32px}
  body{font-size:15px}
  .top .wrap{gap:6px}
  .seg button{padding:10px 11px;font-size:13px}
}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="seg" id="mode"><button data-m="2v2" class="on">2v2</button><button data-m="2v2v2">2v2v2</button></div>
  <div class="seg" id="slot"><button data-s="front" class="on">Front</button><button data-s="back">Back</button></div>
  <button class="ghost" id="snd" title="Toggle sound">🔊</button>
  <button class="ghost" id="reset">Reset</button>
</div></div>

<div class="wrap">
  <div class="chips" id="chips"></div>
  <div id="picker"></div>
  <div id="out"></div>
</div>

<script>
const G = {
 usa:{n:"USA (vanilla)",f:"USA",d:"Balanced; rockvees, then Paladins + air",
  tech:"Cold Fusion $800 → Supply Center $2000 → War Factory $2000 / Airfield $1000 → Strategy Center $2500",
  rush:{t:"4:30–5:30",b:["Cold Fusion Reactor ($800) FIRST — the Supply Center will not build without power","Supply Center ($2000) + 2nd Dozer; Chinooks onto the supply pile","Barracks ($600) → 2 Missile Defenders ($300 ea) to hold your ramp","War Factory ($2000) → Humvees ($700), load a Missile Defender in each","Push at ~4:30 with 4–5 rockvees; buy TOW Missile at the War Factory if they went tanks"],k:["'Rockvee' = Humvee with a Missile Defender inside. It is your rush, your AA and your anti-tank.","TOW Missile (War Factory upgrade) is the cheapest anti-armour you have — buy it in every China matchup"]},
  mid:{t:"8–14 min",b:["Strategy Center ($2500, needs a War Factory or Airfield) → Composite Armor + Drone Armor","Airfield ($1000) → Raptors, then Laser Point Target","Crusaders + Paladins on the choke; rockvees roaming the flanks","Tomahawks ($1200 — they REQUIRE the Strategy Center)"],k:["Search & Destroy is the default battle plan; switch to Hold the Line only when turtling","Everything expensive you want later is behind the Strategy Center — build it on time"]},
  late:{t:"15 min+",b:["Paladin + Microwave ball with an Ambulance behind it","Auroras ($2500, also Strategy Center) onto production","Tomahawk line behind the tanks","Patriots ($1000, need power) on the second expansion"],k:["Auroras are untouchable inbound and fragile flying home — strike, never loiter"]},
  adapt:["GATTLING TANKS or QUAD CANNONS → your Missile Defenders and Comanches evaporate. Lead with Crusaders/Paladins and TOW Humvees, or go Raptors.","TANK HUNTER / RPG mass → Humvees melt. Bring Crusaders and clear the infantry with Rangers or a Microwave.","THEY TURTLE behind Gattling Cannons/Stingers → don't push. Take a 2nd supply and tech to Tomahawks + Auroras, which out-range everything static.","NO DEFENCE SCOUTED by 4:00 → commit everything, rockvees kill dozers faster than they can rebuild."]},

 laser:{n:"Laser (Townes)",f:"USA",d:"Power-hungry; Laser Crusaders + Laser Turrets, no Paladin/Tomahawk",
  tech:"Cold Fusion $800 (your Barracks needs it too) → Supply Center → War Factory → Strategy Center",
  rush:{t:"4:30–6:00",b:["Cold Fusion Reactor first — for you it gates the Barracks as well as the Supply Center","Supply Center + 2nd Dozer; plan a SECOND reactor before you plan an army","Barracks → Missile Defenders; Laser Turret at the choke (it hits ground and air)","War Factory → Laser Crusaders + an Avenger ($2000)","Poke with Laser Crusaders + MDs; do not overextend from your power"],k:["You trade Paladin and Tomahawk away for the Laser Crusader — it is your only tank and it hits hard","Low power switches off your turrets AND your tanks. Two spare reactors, always."]},
  mid:{t:"8–14 min",b:["3rd + 4th Cold Fusion, then Control Rods at a Power Plant","Avengers x2 — their point-defense lasers swat incoming missiles","Strategy Center → Composite Armor; Microwave ($800) for defence cracking","Comanches with Rocket Pods"],k:["Avenger PDL blunts Tomahawks/Scuds but saturates — pair them, never solo","Artillery SHELLS are not missiles: Inferno and Nuke Cannon fire goes straight through your Avengers"]},
  late:{t:"15 min+",b:["Laser Crusader + Avenger + Microwave push","Auroras (Strategy Center) on their production","Laser Turret creep toward their expansions"],k:["Mass artillery and stealth are what kill you — screen both"]},
  adapt:["ANY RAID TOWARD YOUR REACTORS (bikes, Kell, Chinooks, terrorists) → this is the loss condition. Garrison MDs at the power block before you reinforce the front.","INFERNO / NUKE CANNON / SCUD → Avengers cannot stop shells. Kill the artillery with Comanches or a Laser Crusader flank.","GATTLING TANKS / QUADS → good news, your Laser Crusaders outclass them. Keep MDs home and push armour.","THEY TECH FAST (early Propaganda Center / Palace) → hit now, before their tech lands; you are strongest in the 6–10 min window."]},

 air:{n:"Air Force (Granger)",f:"USA",d:"No tanks at all; Combat Chinooks + jets",
  tech:"Cold Fusion → Supply Center → WAR FACTORY (gates the Combat Chinook) → Airfield → Strategy Center for Auroras/Tomahawks",
  rush:{t:"5:00–6:30",b:["Cold Fusion ($800) → Supply Center ($2000) + 2nd Dozer","Barracks ($600) → Missile Defenders; they are your only ground damage for a while","WAR FACTORY ($2000) — required before any Chinook play, and it builds your Humvees","SCOUT their War Factory before you commit the drop","Airfield ($1000) → Raptors ($1400). Vs China, this is the opener, not the Chinook."],k:["You have NO Crusaders or Paladins, ever. Humvees (with TOW), Avengers, Tomahawks and aircraft are your whole army.","Buy TOW Missile at the War Factory — Humvees are your only mobile anti-tank"]},
  mid:{t:"8–14 min",b:["2nd + 3rd Airfield; Countermeasures before you fly into any China or GLA army","Comanches with Rocket Pods; Stealth Comanche upgrade when you can afford it","Avengers to escort and to cover your airfields","Strategy Center if you want Tomahawks or Auroras"],k:["Countermeasures is not optional against Gattlings, Quads or MiGs","Stealth Fighters one wave ahead to delete AA, then the strike wave"]},
  late:{t:"14 min+",b:["Auroras ($2500, needs Strategy Center) on production and superweapons","Raptor screen against their air","Combat Chinook harass in three corners at once","Tomahawks + Avengers as the ground anchor"],k:["Alpha-strike with 4+ jets on one target; trickled aircraft just feed their AA"]},
  adapt:["GATTLING TANKS ($800, no tech needed — assume EVERY China opens with them) → do NOT drop Chinooks and do NOT send Comanches. Raptors kill Gattlings; TOW Humvees and Avengers hold the ground.","QUAD CANNONS → same rule. Kill them with Raptors or Tomahawks before any helicopter goes in.","MASS AA (Gattling Cannons, Stingers, Avengers) → stop flying into it. Take the map with Humvees, expand, and out-eco them instead.","THEY HAVE NO AA AT 5:00 → Raptors on dozers and supply gatherers, every 30 seconds, until they build some.","THEIR TANKS PUSH YOU → you cannot trade tanks. Patriots + TOW Humvees at home while Raptors kill the column from above."]},

 super:{n:"Superweapon (Alexander)",f:"USA",d:"Pro rules: ONE cannon. EMP Patriots, no tanks",
  tech:"Cold Fusion $800 → Supply Center → War Factory → STRATEGY CENTER $2500 → Particle Cannon (Strategy Center gates the cannon, Tomahawks, Microwave and Aurora)",
  rush:{t:"None — hold to 6:00",b:["Cold Fusion ($800) → Supply Center ($2000) → 2nd Dozer","Advanced Control Rods at the Power Plant — your reactors give quadruple output","EMP Patriots ($1000, need power) on the ramp + Missile Defenders inside a Firebase","War Factory → Humvees with MDs. You have NO Crusaders or Paladins.","Bank toward the Strategy Center — nothing you actually want exists without it"],k:["PRO RULES: one superweapon. Yours is cheaper than the standard $5000 cannon, so it lands early.","EMP Patriot is yours by default and it disables vehicles outright — it is the best static defence in the game"]},
  mid:{t:"9–15 min",b:["STRATEGY CENTER ($2500) — mandatory; it gates the cannon, Tomahawks, Microwave and Aurora Alpha","Particle Cannon as soon as it is affordable; place it deep, ringed with EMP Patriots","Tomahawk line behind the Patriots","3rd expansion while they cannot punish you"],k:["Skipping the Strategy Center is how this general loses — check it is up before you bank for the cannon","One cannon under these rules: overbuild its defence, never leave it on the perimeter"]},
  late:{t:"16 min+",b:["Fire on PRODUCTION and artillery, never on a moving army","Sweep across War Factories/Airfields or a stalled push","Tomahawk + Avenger + Microwave creep behind each volley","Aurora Alphas to finish cracked bases"],k:["Cannon priority: enemy superweapon > production > artillery > eco","Time the ground push to arrive WITH the volley, not after it"]},
  adapt:["EARLY RUSH (Tank general, Fai, GLA tunnel) → EMP Patriots plus a Firebase full of MDs holds it. Do not build the Strategy Center until the first push is dead.","THEY EXPAND WIDE / TURTLE → you win this game. Take a third supply and rush the cannon.","MASS ARTILLERY (Scuds, Nuke Cannons, Tomahawks) → they out-range your Patriots. Kill it with Aurora Alphas, not by adding more defence.","STEALTH / SNEAK ATTACK NEAR YOUR CANNON → put a Pathfinder or a Sentry Drone beside it; a hijacked or bombed cannon ends the game."]},

 china:{n:"China (vanilla)",f:"China",d:"Tank mass, horde bonus",
  tech:"Nuclear Reactor $1000 → Supply Center $1500 → War Factory $2000 → Propaganda Center $2000 (gates Overlord, Inferno, Speaker Tower)",
  rush:{t:"4:30–5:30",b:["Nuclear Reactor ($1000) FIRST — the Supply Center needs power","Supply Center ($1500) + 2nd Dozer","Barracks ($500, no tech needed) → a Red Guard pair to hold the ramp","War Factory ($2000). Vs vehicles open Battlemasters ($800); vs infantry or air open a Gattling Tank ($800)","5 Battlemasters — the horde bonus needs 5+ — then push"],k:["Horde bonus is +25% rate of fire at 5 or more of the same unit. Four tanks is a wasted push.","PRO RULES WARNING: Uranium Shells and Nuclear Tanks are sold ONLY at the Nuclear Missile silo. With superweapons banned you never get them — Nationalism and Chain Guns are your only damage upgrades."]},
  mid:{t:"8–14 min",b:["Propaganda Center ($2000) → Nationalism (bigger horde bonus)","Overlord ($2000, needs Propaganda Center) with a Speaker Tower to heal the horde","Chain Guns upgrade if their infantry or air is real; Black Napalm for Dragons and MiGs","Bunker ($400, needs Barracks) + Gattling Cannon ($1200, needs power) on the choke"],k:["Speaker Tower Overlord heals everything nearby — two of them anchor any push"]},
  late:{t:"15 min+",b:["Overlord mass with 2+ Speaker Towers","Inferno Cannons ($900, need Propaganda Center) behind the line","MiGs with Black Napalm on their economy","ECM Tanks ($800) to soak missiles on the approach"],k:["Counter-artillery and toxin kill hordes — spread out and lead with the Overlords"]},
  adapt:["THEY GO INFANTRY (Fai, Rebels, Rangers in buildings) → Dragon Tank or Gattling Tank, not more Battlemasters. Burn garrisons, don't shoot them.","THEY GO AIR (Granger, Comanches, MiGs) → Gattling Tanks in the ball and a Gattling Cannon at home. Battlemasters cannot shoot up at all.","THEY TURTLE behind Patriots/Stingers → Inferno Cannons out-range static defence. Tech to Propaganda Center instead of throwing tanks in.","MISSILE DEFENDERS / TANK HUNTERS in the open → drive over them; AT infantry loses to a moving horde but shreds a stalled one.","THEY RUSH YOU FIRST → Bunker at the ramp with Red Guards inside, and keep producing. Your tanks are cheap; win the attrition."]},

 tank:{n:"Tank (Kwai)",f:"China",d:"Cheap veteran tanks; NO artillery of any kind",
  tech:"Nuclear Reactor $1000 → Supply Center $1500 → War Factory $2000 → Propaganda Center (Emperor, Autoloader)",
  rush:{t:"4:00–5:00 — one of the strongest ground rushes",b:["Nuclear Reactor ($1000) → Supply Center ($1500) → 2nd Dozer","War Factory ($2000) as early as you can afford it","5 Battlemasters ($700 for you, and they spawn veteran) — 5 for the horde bonus","Reinforce in a continuous stream; never let the factory idle","Kill dozers and supply trucks first, then the Supply Center"],k:["Your discount and veterancy IS the strategy — you simply arrive with more tank than anyone else can have","PRO RULES: no Nuclear Missile silo means no Uranium Shells for you either. Nationalism + Autoloader are your damage."]},
  mid:{t:"7–12 min",b:["Propaganda Center ($2000) → Nationalism, then Autoloader (3-shot burst)","Emperor Overlord (yours, built veteran with a Speaker Tower already on it)","Gattling Tanks ($800) the moment you see any aircraft","2nd supply while you keep the pressure on"],k:["You have NO Inferno and NO Nuke Cannon. You cannot siege anything. Keep the game mobile and kill economy.","Never lose the Emperor — pull it out early, it is healing your whole horde"]},
  late:{t:"13 min+",b:["Emperor + Battlemaster mass, reinforced without pause","ECM Tanks to soak the first missile volley on the approach","MiGs to kill the artillery you cannot out-range","Overrun static lines with numbers, from multiple angles"],k:["Every artillery piece they own out-ranges everything you own — charge it or MiG it, never sit in front of it"]},
  adapt:["TOMAHAWKS / SCUDS / NUKE CANNONS → your hard counter, and you have no reply in kind. Rush them with speed and ECM, or go around and kill the economy feeding them.","GATTLING TANKS / QUADS → they beat your infantry but not your armour. Just keep rolling Battlemasters.","AIR (Comanches, Raptors, Helixes) → Gattling Tanks inside the horde, immediately. Battlemasters cannot shoot up.","THEY WALL UP WITH BUNKERS/FIREBASES → do not grind into it. Take the map, take every supply, and starve them.","THEY MATCH YOUR TANKS → you still win: yours are cheaper and veteran. Trade, reinforce, repeat."]},

 inf:{n:"Infantry (Shin Fai)",f:"China",d:"Minigunner hordes + Gattlings, Dragons, Infernos. No Battlemaster/Overlord",
  tech:"Barracks $500 (no prereq — why you rush first) → Nuclear Reactor → Supply Center → War Factory → Propaganda Center (Fanaticism, Inferno)",
  rush:{t:"3:00–4:30 — earliest rush in the game",b:["Barracks ($500) FIRST — it needs no power and no supply centre","Minigunners (your Red Guard replacement — cheaper, built in pairs) — 6+ and move at ~3:00","Nuclear Reactor + Supply Center behind the rush, not before it","Add Tank Hunters ($300) the moment you see any vehicle","Attack-move onto dozers and workers; capture civilian buildings on the way"],k:["Horde bonus at 5+ — keep them bunched and they fire 25% faster","This is a real all-in. If the flood does nothing you are behind on economy, so make it count."]},
  mid:{t:"7–12 min",b:["Propaganda Center ($2000) → FANATICISM (you get this instead of Nationalism)","War Factory: Gattling Tanks ($800) and Dragon Tanks ($800) — yes, you have both","Troop Crawlers ($1400) / Attack Outposts to move infantry safely","Listening Outposts for stealth detection"],k:["You have NO Battlemaster, Overlord or Emperor — Gattling, Dragon, Inferno and ECM are your armour","A Troop Crawler full of Tank Hunters is your real anti-tank answer"]},
  late:{t:"13 min+",b:["Inferno Cannons ($900, need Propaganda Center) — your siege and your horde-clearer","Dragon Tanks to burn garrisons and choke points","Helix ($1500) with Napalm Bomb + Speaker Tower","Minigunner stream from 3+ barracks, endlessly"],k:["Artillery, flame and toxin delete infantry hordes — never clump against Thrax, Juhziz or Infernos"]},
  adapt:["DRAGON TANKS, INFERNOS, TOXIN or FLAME → your horde evaporates in one shot. Spread wide, lead with Gattling/Dragon Tanks of your own, and snipe the artillery.","GATTLING TANKS / QUADS → the direct counter to everything you build. Do not walk infantry into them; kill them with Tank Hunters at range or your own Infernos.","GARRISONED BUILDINGS → Dragon Tanks, not Minigunners. Burning them out costs you nothing.","ARMOUR BALL → Tank Hunters in a Troop Crawler, plus Infernos behind. Never fight tanks with Minigunners in the open.","THEY HAVE NO SPLASH AT 3:30 → keep flooding. Minigunners beat every non-splash unit in the game at that stage."]},

 nuke:{n:"Nuke (Tsing Shi Tao)",f:"China",d:"Free uranium tanks that explode on death; Nuke Cannons",
  tech:"Nuclear Reactor → Supply Center → War Factory → Propaganda Center (Isotope Stability, Overlord, Inferno, Nuke Cannon)",
  rush:{t:"4:30–5:30",b:["Nuclear Reactor ($1000) → Supply Center ($1500) → 2nd Dozer","War Factory ($2000) → Battlemasters ($800)","5 tanks for the horde, push at ~5:00","Advanced Nuclear Reactors later — more power per building, but a bigger crater when killed"],k:["PRO RULES BONUS: Uranium Shells and Nuclear Tanks are FREE and pre-installed for you. Every other China general needs the banned Nuclear Missile silo to buy them — you are the only one with upgraded tanks.","Your tanks explode on death by default — trade into their army, the blast is a free extra unit"]},
  mid:{t:"8–14 min",b:["Propaganda Center ($2000) → Nationalism","Nuke Cannon ($1600 — needs Propaganda Center and one promotion point; free of charge for you to unlock)","Overlord ($2000) with a Speaker Tower in front of the cannons","Isotope Stability ($2000) ONLY if your own death-blasts are killing your horde"],k:["Nuke Cannons out-range every static defence in the game — this is how you crack turtles","Isotope Stability REMOVES your death explosions. Most of the time you want to keep them."]},
  late:{t:"15 min+",b:["Mass Nuke Cannon with an Overlord screen","MiGs (yours carry tactical nukes) to clear AA and artillery","Battlemaster wall in front, cannons behind, always moving"],k:["Watch your own reactors: every China reactor explodes, and yours are the biggest"]},
  adapt:["THEY TURTLE → perfect. Nuke Cannons dismantle static defence from outside its range. Tech straight there.","THEY RUSH YOU → your tanks are individually stronger (free uranium). Hold at a Bunker and trade; the death-blasts do the rest.","AIR → Gattling Tanks in the ball. Your cannons are helpless alone.","FAST FLANKERS ON YOUR CANNONS (bikes, Humvees, Technicals) → never let a cannon sit unescorted; one Gattling Tank per two cannons.","THEIR INFANTRY CLUMPS → drive a Battlemaster in and let it die. The blast is worth more than the tank."]},

 gla:{n:"GLA (vanilla)",f:"GLA",d:"Cheap, fast, tunnels, salvage",

/* ---------- faction audio: Karplus-Strong plucked strings, no assets ---------- */
const SND={ctx:null,on:true};
try{SND.on=localStorage.getItem("zh-snd")!=="0"}catch(e){}

function ac(){
  if(!SND.ctx){try{SND.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(SND.ctx.state==="suspended")SND.ctx.resume();
  return SND.ctx;
}
/* plucked string: noise burst through a tuned delay with lowpass feedback */
function pluck(t,freq,dur,damp,bright,gain){
  const c=SND.ctx,sr=c.sampleRate,n=Math.max(1,Math.round(sr/freq)),len=Math.ceil(sr*dur);
  const buf=c.createBuffer(1,len,sr),d=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<len;i++){
    let v;
    if(i<n){ v=(Math.random()*2-1); v=last=last*(1-bright)+v*bright; }      // filtered noise burst
    else   { v=(d[i-n]+d[i-n-1>=0?i-n-1:0])*0.5*damp; }                     // string decay
    d[i]=v;
  }
  const src=c.createBufferSource();src.buffer=buf;
  const g=c.createGain();g.gain.setValueAtTime(gain,t);
  g.gain.setTargetAtTime(0.0001,t+dur*0.7,dur*0.18);
  const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=freq*6+1200;
  src.connect(lp);lp.connect(g);g.connect(c.destination);
  src.start(t);src.stop(t+dur+0.05);
}
/* hand drum / gong hit */
function hit(t,freq,dur,gain,type){
  const c=SND.ctx;
  const o=c.createOscillator();o.type=type||"sine";
  o.frequency.setValueAtTime(freq*2.4,t);
  o.frequency.exponentialRampToValueAtTime(freq,t+dur*0.35);
  const g=c.createGain();g.gain.setValueAtTime(gain,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
  const nb=c.createBuffer(1,c.sampleRate*0.05,c.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*(1-i/nd.length);
  const ns=c.createBufferSource();ns.buffer=nb;
  const ng=c.createGain();ng.gain.value=gain*0.5;
  ns.connect(ng);ng.connect(c.destination);ns.start(t);
}
const HZ=n=>440*Math.pow(2,(n-69)/12);   // midi -> hz

/* USA — banjo roll, G major pentatonic, bright and fast */
const THEME={
 USA(t){
  const roll=[67,71,74,79,74,79,71,67,62,67];
  roll.forEach((m,i)=>pluck(t+i*0.085,HZ(m),0.55,0.985,0.85,0.16));
  pluck(t+0.85,HZ(55),0.7,0.99,0.6,0.14);
  pluck(t+0.85,HZ(67),0.7,0.987,0.8,0.13);
 },
 /* China — guzheng, D major pentatonic, gong underneath */
 China(t){
  hit(t,78,1.6,0.16,"sine");
  const mel=[74,76,78,81,83,86,83,81,78,74];
  mel.forEach((m,i)=>pluck(t+0.06+i*0.115,HZ(m),1.1,0.9955,0.55,0.15));
  pluck(t+1.28,HZ(62),1.6,0.997,0.45,0.13);
  pluck(t+1.28,HZ(74),1.6,0.996,0.5,0.11);
 },
 /* GLA — oud on Hijaz (D Eb F# G A Bb C), darbuka pulse */
 GLA(t){
  [0,0.30,0.46,0.60,0.90,1.05].forEach((o,i)=>hit(t+o,i%2?150:95,0.16,0.11,"triangle"));
  const mel=[62,63,66,67,69,67,66,63,62];
  mel.forEach((m,i)=>pluck(t+0.05+i*0.125,HZ(m),0.95,0.9935,0.5,0.16));
  pluck(t+1.22,HZ(50),1.5,0.996,0.4,0.15);
  pluck(t+1.22,HZ(62),1.5,0.995,0.45,0.12);
 }
};
let lastSnd=0;
function playFaction(f){
  if(!SND.on)return;
  const c=ac();if(!c||!THEME[f])return;
  if(c.currentTime-lastSnd<0.25)return;      // don't stack on rapid taps
  lastSnd=c.currentTime;
  try{THEME[f](c.currentTime+0.02)}catch(e){}
}

  h+= S.me?chip(S.me,"me"):`<button class="chip add" data-open="me">+ pick your general</button>`;
  h+=`<span class="chip lab">Ally</span>`;
  h+= S.ally?chip(S.ally,"ally"):`<button class="chip add" data-open="ally">+ ally</button>`;
  h+=`<span class="chip lab">Enemy</span>`;
  h+= S.en.map(k=>chip(k,"en")).join("");
  if(S.en.length<maxE())h+=`<button class="chip add" data-open="en">+ enemy</button>`;
  $('chips').innerHTML=h;
}

function drawPicker(){
  const o=S.open;
  if(!o){$('picker').innerHTML="";return;}
  const t={me:"Pick your general",ally:"Pick your ally",en:"Pick enemies you've scouted"}[o];
  const sel=o==="me"?k=>k===S.me:o==="ally"?k=>k===S.ally:k=>S.en.includes(k);
  const dis=o==="en"?k=>!S.en.includes(k)&&S.en.length>=maxE():null;
  $('picker').innerHTML=`<div class="pick"><h2>${t}</h2>${tiles(sel,dis)}</div>`;
}

function li(a){return a.map(x=>`<li>${x}</li>`).join("")}

function drawOut(){
  if(!S.me){$('out').innerHTML='<div class="empty">Pick your general to load the playbook.</div>';return;}
  const g=G[S.me],p=g[S.ph];
  const has=x=>S.en.includes(x);
  let al=[];
  if(has("tank")||has("inf"))al.push(['bad','RUSH INCOMING — real defense up by 4:00. Do not double-expand.']);
  if(has("air"))al.push(['bad','AA before 5:00 or you lose dozers/workers to Raptors.']);
  if(has("stealth")||has("demo"))al.push(['warn','Get detection early. Scout your own ground before moving out.']);
  if(has("laser"))al.push(['warn','Raid Laser\'s power constantly. Don\'t feed lone missiles into Avengers.']);
  if(has("super"))al.push(['warn','Particle Cannon incoming ~10 min — spread production, never clump.']);
  if(has("nuke"))al.push(['warn','Nuke Cannons out-range you and his tanks explode on death — fight from range.']);
  if(has("toxin"))al.push(['warn','Lead with vehicles, not infantry.']);
  if(S.en.length&&!al.length)al.push(['good','No hard early threat — take the map and play the greedy build.']);

  const modeN=S.mode==="2v2v2"
   ?"2v2v2 — never commit everything. Let the other two teams fight first, keep 30% home."
   :"2v2 — attack the SAME enemy as your ally, at the SAME time. Split pushes lose.";
  const slotN=S.slot==="front"
   ?"FRONT — you're the wall. Defense before your 2nd expansion; the rush comes at you."
   :"BACK — you're eco and tech. 2nd supply early, expensive units, reinforce your ally.";
  let combo="";
  if(S.ally){const a=g.f,b=G[S.ally].f;const txt=COMBO[a+"+"+b]||COMBO[b+"+"+a]||"";
    if(txt)combo=`<div class="note"><b>${title(S.me)} + ${title(S.ally)}:</b> ${txt}</div>`;}

  const vs=S.en.map(k=>{const c=C[k],ph=S.ph==="rush"?c.early:S.ph==="mid"?c.mid:c.late;
    return `<div class="vs">vs ${title(k)}<span>${c.th}</span></div><ul class="key">${li(ph)}</ul>`;}).join("");

  $('out').innerHTML=
   al.map(a=>`<div class="alert ${a[0]}">${a[1]}</div>`).join("")+
   `<div class="phases" id="ph">
      ${["rush","mid","late"].map(x=>`<button data-p="${x}" class="${S.ph===x?"on":""}">${{rush:"RUSH",mid:"MID",late:"LATE"}[x]}<small>${g[x].t.split("—")[0].trim()}</small></button>`).join("")}
    </div>
    <div class="panel">
      <div class="tech"><b>TECH GATE</b>${g.tech}</div>
      <h3>${{rush:"Opening / rush",mid:"Mid game",late:"Late game"}[S.ph]} — ${p.t.split("—")[0].trim()}${p.t.includes("—")?` <span class="tag">${p.t.split("—").slice(1).join("—").trim()}</span>`:""}</h3>
      <ol class="bo">${li(p.b)}</ol>
      <ul class="key">${li(p.k)}</ul>
      <div class="sect"><h3 class="ad">⚑ If you scout this — adapt</h3><ul class="key adapt">${li(g.adapt)}</ul></div>
      ${vs?`<div class="sect">${vs}</div>`:""}
      <div class="sect"><h3>Team context</h3>
        <div class="note">${modeN}</div><div class="note">${slotN}</div>${combo}</div>
    </div>`;
  $('ph').onclick=e=>{const b=e.target.closest("button");if(!b)return;S.ph=b.dataset.p;drawOut();};
}

function draw(){drawChips();drawPicker();drawOut();}

$('chips').onclick=e=>{
  const a=e.target.closest("[data-open]");
  if(a){S.open=S.open===a.dataset.open?null:a.dataset.open;drawPicker();return;}
  const c=e.target.closest(".chip[data-k]");
  if(!c)return;
  const r=c.dataset.role;
  if(r==="me")S.me=null; else if(r==="ally")S.ally=null; else S.en=S.en.filter(x=>x!==c.dataset.k);
  S.open=r;draw();
};
$('picker').onclick=e=>{
  const t=e.target.closest(".tile");if(!t||t.classList.contains("off"))return;
  const k=t.dataset.k;
  playFaction(G[k].f);
  if(S.open==="me"){S.me=S.me===k?null:k;S.open=S.me?(S.ally?null:"ally"):"me";}
  else if(S.open==="ally"){S.ally=S.ally===k?null:k;S.open=S.ally?null:"ally";}
  else{S.en.includes(k)?S.en=S.en.filter(x=>x!==k):S.en.push(k); if(S.en.length>=maxE())S.open=null;}
  draw();window.scrollTo({top:0,behavior:"smooth"});
};
$('mode').onclick=e=>{const b=e.target.closest("button");if(!b)return;
  S.mode=b.dataset.m;[...$('mode').children].forEach(x=>x.classList.toggle("on",x===b));
  S.en=S.en.slice(0,maxE());draw();};
$('slot').onclick=e=>{const b=e.target.closest("button");if(!b)return;
  S.slot=b.dataset.s;[...$('slot').children].forEach(x=>x.classList.toggle("on",x===b));draw();};
$('snd').onclick=()=>{
  SND.on=!SND.on;
  $('snd').textContent=SND.on?"🔊":"🔇";
  $('snd').classList.toggle("off",!SND.on);
  try{localStorage.setItem("zh-snd",SND.on?"1":"0")}catch(e){}
  if(SND.on)playFaction("USA");
};
$('snd').textContent=SND.on?"🔊":"🔇";
$('snd').classList.toggle("off",!SND.on);

$('reset').onclick=()=>{S.me=S.ally=null;S.en=[];S.ph="rush";S.open="me";draw();};

draw();
</script>
</body>
</html>
